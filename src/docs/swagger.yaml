openapi: 3.0.0
info:
  title: Nature's Lab
  version: 1.0.0
  description: API documentation for nature's lab

servers:
  - url: https://api.bestpriceindia.net/api
    description: Production server
  - url: http://localhost:5000/api
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authorization
  tags:
    - name: Auth
      description: Authentication endpoints for user signup, login, password reset
    - name: User Profile
      description: User profile management endpoints
    - name: Admin Auth
      description: Admin authentication endpoints for login, profile management
    - name: Admin Profile
      description: Admin profile management endpoints
    - name: Admin User Operations
      description: Admin user management endpoints

paths:
  /auth/signup:
    $ref: "./paths/auth.yaml#/signup"

  /auth/login:
    $ref: "./paths/auth.yaml#/login"
  
  /auth/logout:
    $ref: "./paths/auth.yaml#/logout"

  /auth/forgot-password:
    $ref: "./paths/auth.yaml#/forgotPassword"
  
  /auth/verify-otp:
    $ref: "./paths/auth.yaml#/verifyOTP"
  
  /auth/reset-password:
    $ref: "./paths/auth.yaml#/resetPassword"
  
  /auth/resend-otp:
    $ref: "./paths/auth.yaml#/resendOTP"

  /admin/auth/login:
    $ref: "./paths/adminAuth.yaml#/login"

  /admin/profile:
    get:
      $ref: "./paths/adminAuth.yaml#/getProfile"
  
  /admin/profile/update-profile:
    put:
      $ref: "./paths/adminAuth.yaml#/updateProfile"

  /admin/profile/change-password:
    patch:
      $ref: "./paths/adminAuth.yaml#/changePassword"

  /admin/auth/logout:
    $ref: "./paths/adminAuth.yaml#/logout"

  /admin/users:
    get:
      $ref: "./paths/adminUserOperations.yaml#/getAllUsers"

  /admin/users/getUser/{id}:
    get:
      $ref: "./paths/adminUserOperations.yaml#/getUserById"

  /admin/users/enable-disable:
    put:
      $ref: "./paths/adminUserOperations.yaml#/enableDisableUser"
  
  /admin/users/getUserByPhoneOrName:
    get:
      $ref: "./paths/adminUserOperations.yaml#/getUserByPhoneOrName"

  /profile:
    get:
      $ref: "./paths/userProfile.yaml#/getProfile"
    put:
      $ref: "./paths/userProfile.yaml#/updateProfile"
    delete:
      $ref: "./paths/userProfile.yaml#/deleteAccount"

  /profile/change-password:
    patch:
      $ref: "./paths/userProfile.yaml#/changePassword"
  
  /profile/add-address:
    post:
      $ref: "./paths/userProfile.yaml#/addAddress"
  
  /profile/update-address/{addressId}:
    put:
      $ref: "./paths/userProfile.yaml#/updateAddress"
    
  /profile/delete-address:
    delete:
      $ref: "./paths/userProfile.yaml#/deleteAddress"
  