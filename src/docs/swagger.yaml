openapi: 3.0.0
info:
  title: Nature's Lab
  version: 1.0.0
  description: API documentation for nature's lab

servers:
  - url: https://apis.bestpriceindia.net/api
    description: Production server
  - url: http://localhost:5000/api
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authorization
  tags:
    - name: Auth
      description: Authentication endpoints for user signup, login, password reset
    - name: User Profile
      description: User profile management endpoints
    - name: Admin Auth
      description: Admin authentication endpoints for login, profile management
    - name: Admin Profile
      description: Admin profile management endpoints
    - name: Admin User Operations
      description: Admin user management endpoints
    - name: Admin Product Operations
      description: Admin product management endpoints
    - name: Admin Order Management
      description: Admin order management and retrieval endpoints
    - name: Common
      description: Common endpoints for users as well as admins
    - name: Cart
      description: Cart endpoints for user adding products to cart , updating them, deleting products and clearing cart
    - name: Admin Constants
      description: Admin endpoints for managing app constants like charges, taxes, and promotional content
    - name: Static Pages
      description: Static pages - Contact Us, About Us, Privacy Policy, Terms & Conditions
    - name: Order
      description: Order creation and payment verification endpoints
    - name: Admin Warehouse Operations
      description: Admin warehouse management endpoints


paths:
  /auth/signup:
    $ref: "./paths/auth.yaml#/signup"

  /auth/login:
    $ref: "./paths/auth.yaml#/login"
  
  /auth/logout:
    $ref: "./paths/auth.yaml#/logout"

  /auth/forgot-password:
    $ref: "./paths/auth.yaml#/forgotPassword"
  
  /auth/verify-otp:
    $ref: "./paths/auth.yaml#/verifyOTP"
  
  /auth/reset-password:
    $ref: "./paths/auth.yaml#/resetPassword"
  
  /auth/resend-otp:
    $ref: "./paths/auth.yaml#/resendOTP"

  /profile:
    get:
      $ref: "./paths/userProfile.yaml#/getProfile"
    put:
      $ref: "./paths/userProfile.yaml#/updateProfile"
    delete:
      $ref: "./paths/userProfile.yaml#/deleteAccount"

  /profile/change-password:
    patch:
      $ref: "./paths/userProfile.yaml#/changePassword"
  
  /profile/add-address:
    post:
      $ref: "./paths/userProfile.yaml#/addAddress"
  
  /profile/update-address/{addressId}:
    put:
      $ref: "./paths/userProfile.yaml#/updateAddress"
    
  /profile/delete-address:
    delete:
      $ref: "./paths/userProfile.yaml#/deleteAddress"

  /cart/add:
    post:
      $ref: "./paths/cartOperations.yaml#/addToCart"
  /cart:
    put:
      $ref: "./paths/cartOperations.yaml#/updateCart"
    get:
      $ref: "./paths/cartOperations.yaml#/getCart"
  
  /cart/remove-product/{productId}:
    delete:
      $ref: "./paths/cartOperations.yaml#/removeProduct"
  
  /cart/clear:
    delete:
      $ref: "./paths/cartOperations.yaml#/clearCart"

  /admin/auth/login:
    $ref: "./paths/adminAuth.yaml#/login"

  /admin/profile:
    get:
      $ref: "./paths/adminAuth.yaml#/getProfile"
  
  /admin/profile/update-profile:
    put:
      $ref: "./paths/adminAuth.yaml#/updateProfile"

  /admin/profile/change-password:
    patch:
      $ref: "./paths/adminAuth.yaml#/changePassword"

  /admin/auth/logout:
    $ref: "./paths/adminAuth.yaml#/logout"

  /admin/users:
    get:
      $ref: "./paths/adminUserOperations.yaml#/getUsers"

  /admin/users/getUser/{id}:
    get:
      $ref: "./paths/adminUserOperations.yaml#/getUserById"

  /admin/users/enable-disable:
    put:
      $ref: "./paths/adminUserOperations.yaml#/enableDisableUser"

  /admin/products/add-product:
    post:
      $ref: "./paths/adminProductOperations.yaml#/addProduct"
  
  /admin/products/update-product/{productId}:
    put:
      $ref: "./paths/adminProductOperations.yaml#/updateProduct"  
  
  /admin/products/delete-product/{productId}:
    delete:
      $ref: "./paths/adminProductOperations.yaml#/deleteProduct"

  /admin/orders:
    get:
      $ref: "./paths/adminOrder.yaml#/getOrders"

  /admin/orders/{orderId}:
    get:
      $ref: "./paths/adminOrder.yaml#/getOrderById"

  /admin/constants:
    put:
      $ref: "./paths/appConstants.yaml#/updateConstants"

  /constants:
    get:
      $ref: "./paths/appConstants.yaml#/getConstants"
  
  /products/get-products:
    get: 
      $ref: "./paths/common.yaml#/getProducts"
  
  /products/get-product/{productId}:
    get:
      $ref: "./paths/common.yaml#/getProductById"

  /contact-us:
    post:
      $ref: "./paths/staticRoutes.yaml#/sendQuery"

  /about-us:
    get:
      $ref: "./paths/staticRoutes.yaml#/getAboutUs"

  /privacy-policy:
    get:
      $ref: "./paths/staticRoutes.yaml#/getPrivacyPolicy"

  /terms-and-conditions:
    get:
      $ref: "./paths/staticRoutes.yaml#/getTermsAndConditions"

  /order/create-order:
    post:
      $ref: "./paths/orderUser.yaml#/createOrder"

  /order/verify-payment:
    post:
      $ref: "./paths/orderUser.yaml#/verifyPayment"

  /order/my-orders:
    get:
      $ref: "./paths/orderUser.yaml#/getMyOrders"

  /order/my-orders/{orderId}:
    get:
      $ref: "./paths/orderUser.yaml#/getMyOrderById"

  /admin/warehouses:
    get:
      $ref: "./paths/adminWarehouseOperations.yaml#/getWarehouses"
    post:
      $ref: "./paths/adminWarehouseOperations.yaml#/addWarehouse"

  /admin/warehouses/{id}:
    get:
      $ref: "./paths/adminWarehouseOperations.yaml#/getWarehouseById"
    put:
      $ref: "./paths/adminWarehouseOperations.yaml#/updateWarehouse"
    delete:
      $ref: "./paths/adminWarehouseOperations.yaml#/deleteWarehouse"


