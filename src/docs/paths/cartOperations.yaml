addToCart:
    summary: Add products to cart
    description: Add one or more products to the authenticated user's shopping cart.
    tags:
      - Cart
    security:
      - bearerAuth: []
    requestBody:
      required: true
      description: Products to add to cart with quantities
      content:
        application/json:
          schema:
            type: object
            required:
              - products
            properties:
              products:
                type: array
                minItems: 1
                description: Array of products to add
                items:
                  type: object
                  properties:
                    productId:
                      type: string
                      description: MongoDB product ID
                      example: "507f1f77bcf86cd799439011"
                    quantity:
                      type: number
                      description: Product quantity (minimum 1)
                      example: 2
                      minimum: 1
    responses:
      200:
        description: Products added to cart successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                statusCode:
                  type: number
                  example: 200
                message:
                  type: string
                  example: "Success"
                data:
                  type: object
                  properties:
                    products:
                      type: array
                      items:
                        type: object
                        properties:
                          product:
                            type: object
                            properties:
                              _id:
                                type: string
                                example: "507f1f77bcf86cd799439011"
                              name:
                                type: string
                                example: "Product Name"
                              price:
                                type: number
                                example: 299.99
                          quantity:
                            type: number
                            example: 2
                          price:
                            type: number
                            example: 299.99
                    handlingCharge:
                      type: number
                      example: 50
                    shippingFee:
                      type: number
                      example: 100
                    tax:
                      type: number
                      example: 85.80
      400:
        description: Invalid request or insufficient stock

getCart:
    summary: Get user's cart
    description: Retrieve the complete shopping cart of the authenticated user including all products and charges.
    tags:
      - Cart
    security:
      - bearerAuth: []
    responses:
      200:
        description: Cart retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                statusCode:
                  type: number
                  example: 200
                message:
                  type: string
                  example: "Success"
                data:
                  type: object
                  properties:
                    products:
                      type: array
                      items:
                        type: object
                        properties:
                          product:
                            type: object
                            properties:
                              _id:
                                type: string
                                example: "507f1f77bcf86cd799439011"
                              name:
                                type: string
                                example: "Product Name"
                              description:
                                type: string
                                example: "Product description"
                              price:
                                type: number
                                example: 299.99
                          quantity:
                            type: number
                            example: 2
                          price:
                            type: number
                            example: 299.99
                    deliveryAddress:
                      type: string
                      description: MongoDB address ID
                      example: "507f1f77bcf86cd799439011"
                    selectedAddress:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: "507f1f77bcf86cd799439011"
                        houseNumberAndFloor:
                          type: string
                          example: "123/A"
                        buildingAndBlock:
                          type: string
                          example: "Tower B"
                        city:
                          type: string
                          example: "Mumbai"
                        state:
                          type: string
                          example: "Maharashtra"
                        country:
                          type: string
                          example: "India"
                        type:
                          type: string
                          example: "home"
                    handlingCharge:
                      type: number
                      example: 50
                    shippingFee:
                      type: number
                      example: 100
                    tax:
                      type: number
                      example: 85.80
                    grandTotal:
                      type: number
                      description: Total amount including all charges
                      example: 1185.80

updateCart:
    summary: Update cart items or delivery address
    description: Update product quantities in cart (0 = remove item) or set delivery address.
    tags:
      - Cart
    security:
      - bearerAuth: []
    requestBody:
      required: true
      description: Updated cart data with products and/or address
      content:
        application/json:
          schema:
            type: object
            required:
              - products
            properties:
              products:
                type: array
                description: Array of products with updated quantities
                items:
                  type: object
                  properties:
                    productId:
                      type: string
                      description: MongoDB product ID
                      example: "507f1f77bcf86cd799439011"
                    quantity:
                      type: number
                      description: Updated quantity (0 = remove item)
                      example: 1
                      minimum: 0
              addressId:
                type: string
                description: MongoDB address ID for delivery (optional)
                example: "507f1f77bcf86cd799439011"
    responses:
      200:
        description: Cart updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                statusCode:
                  type: number
                  example: 200
                message:
                  type: string
                  example: "Success"
                data:
                  type: object
                  properties:
                    products:
                      type: array
                      items:
                        type: object
                        properties:
                          product:
                            type: object
                          quantity:
                            type: number
                          price:
                            type: number
                    deliveryAddress:
                      type: string
                    selectedAddress:
                      type: object
                    handlingCharge:
                      type: number
                    shippingFee:
                      type: number
                    tax:
                      type: number
                    grandTotal:
                      type: number

removeProduct:
    summary: Remove product from cart
    description: Remove a specific product from the authenticated user's shopping cart.
    tags:
      - Cart
    security:
      - bearerAuth: []
    parameters:
      - name: productId
        in: path
        required: true
        description: MongoDB ID of the product to remove
        schema:
          type: string
          example: "507f1f77bcf86cd799439011"
    responses:
      200:
        description: Product removed from cart successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                statusCode:
                  type: number
                  example: 200
                message:
                  type: string
                  example: "Success"
                data:
                  type: object
                  properties:
                    products:
                      type: array
                      items:
                        type: object
                    handlingCharge:
                      type: number
                    shippingFee:
                      type: number
                    tax:
                      type: number
                    grandTotal:
                      type: number
      400:
        description: Product not found in cart

clearCart:
    summary: Clear entire cart
    description: Remove all products from the authenticated user's shopping cart.
    tags:
      - Cart
    security:
      - bearerAuth: []
    responses:
      200:
        description: Cart cleared successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                statusCode:
                  type: number
                  example: 200
                message:
                  type: string
                  example: "Success"
                data:
                  type: object
                  properties:
                    message:
                      type: string
                      example: "Cart cleared"
