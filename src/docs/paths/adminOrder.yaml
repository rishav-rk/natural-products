getOrders:
  summary: Get all orders with optional date range filtering
  tags:
    - Admin Order Management
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: status
      schema:
        type: string
        default: 'In Progress'
      description: Track by order status
    - in: query
      name: page
      schema:
        type: integer
        default: 0
      description: Page number for pagination (0-indexed)
    - in: query
      name: limit
      schema:
        type: integer
        default: 10
      description: Number of orders per page
    - in: query
      name: startDate
      schema:
        type: string
        format: date
      description: Filter orders from this start date (inclusive). Format YYYY-MM-DD
      example: "2024-01-01"
    - in: query
      name: endDate
      schema:
        type: string
        format: date
      description: Filter orders until this end date (inclusive). Format YYYY-MM-DD
      example: "2024-12-31"
  responses:
    200:
      description: Orders retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Success"
              data:
                type: object
                properties:
                  order:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: "60c72b2f9b1d8e5a5c8f9b1a"
                        orderId:
                          type: string
                          example: "ORD-123456"
                        placedOn:
                          type: string
                          format: date-time
                          example: "2024-01-15T10:30:00Z"
                        user:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: "60c72b2f9b1d8e5a5c8f9b2a"
                            name:
                              type: string
                              example: "John Doe"
                            email:
                              type: string
                              example: "john@example.com"
                        products:
                          type: array
                          items:
                            type: object
                            properties:
                              product:
                                type: string
                                example: "60c72b2f9b1d8e5a5c8f9b3a"
                              name:
                                type: string
                                example: "Aloe Vera Gel"
                              quantity:
                                type: integer
                                example: 2
                              price:
                                type: number
                                example: 19.99
                        itemTotal:
                          type: number
                          example: 39.98
                        tax:
                          type: number
                          example: 5.00
                        additionalCharges:
                          type: number
                          example: 0
                        grandTotalAmount:
                          type: number
                          example: 44.98
                        shippingAddress:
                          type: object
                          properties:
                            address:
                              type: string
                              example: "123 Main Street"
                            city:
                              type: string
                              example: "Ahmedabad"
                            state:
                              type: string
                              example: "Gujarat"
                            pincode:
                              type: string
                              example: "380001"
                        status:
                          type: string
                          enum: [In Progress, On the Way, Delivered]
                          example: "In Progress"
                        payment:
                          type: object
                          properties:
                            method:
                              type: string
                              enum: [creditCard, debitCard, upi, netBanking, wallet]
                              example: "upi"
                            status:
                              type: string
                              enum: [pending, completed]
                              example: "completed"
    400:
      description: Validation failed - invalid query parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Invalid query parameters"
    401:
      description: Unauthorized - admin authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Unauthorized access"
    500:
      description: Server error

getOrderById:
  summary: Get a specific order by ID
  tags:
    - Admin Order Management
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: orderId
      required: true
      schema:
        type: string
        format: mongodb-objectid
      description: The MongoDB ID of the order
      example: "60c72b2f9b1d8e5a5c8f9b1a"
  responses:
    200:
      description: Order retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Success"
              data:
                type: object
                properties:
                  order:
                    type: object
                    properties:
                      _id:
                        type: string
                        example: "60c72b2f9b1d8e5a5c8f9b1a"
                      orderId:
                        type: string
                        example: "ORD-123456"
                      placedOn:
                        type: string
                        format: date-time
                        example: "2024-01-15T10:30:00Z"
                      user:
                        type: object
                        properties:
                          _id:
                            type: string
                            example: "60c72b2f9b1d8e5a5c8f9b2a"
                          name:
                            type: string
                            example: "John Doe"
                          email:
                            type: string
                            example: "john@example.com"
                          phone:
                            type: string
                            example: "+91-9876543210"
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            product:
                              type: string
                              example: "60c72b2f9b1d8e5a5c8f9b3a"
                            name:
                              type: string
                              example: "Aloe Vera Gel"
                            quantity:
                              type: integer
                              example: 2
                            price:
                              type: number
                              example: 19.99
                      itemTotal:
                        type: number
                        example: 39.98
                      tax:
                        type: number
                        example: 5.00
                      additionalCharges:
                        type: number
                        example: 0
                      grandTotalAmount:
                        type: number
                        example: 44.98
                      shippingAddress:
                        type: object
                        properties:
                          address:
                            type: string
                            example: "123 Main Street"
                          city:
                            type: string
                            example: "Ahmedabad"
                          state:
                            type: string
                            example: "Gujarat"
                          pincode:
                            type: string
                            example: "380001"
                      status:
                        type: string
                        enum: [In Progress, On the Way, Delivered]
                        example: "In Progress"
                      payment:
                        type: object
                        properties:
                          method:
                            type: string
                            enum: [creditCard, debitCard, upi, netBanking, wallet]
                            example: "upi"
                          status:
                            type: string
                            enum: [pending, completed]
                            example: "completed"
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
    400:
      description: Validation failed - invalid order ID format
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Invalid order ID format"
    401:
      description: Unauthorized - admin authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Unauthorized access"
    404:
      description: Order not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Order not found"
    500:
      description: Server error
